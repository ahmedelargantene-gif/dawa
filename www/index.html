<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منبّه الدواء</title>
<style>
:root{--bg:#f3f8fa;--card:#fff;--ink:#12303a;--mut:#5d7882;--main:#0b7a8f;--ok:#1f8a4c;--warn:#c4571a;--line:#d5e3e8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b20;--card:#162830;--ink:#e6f1f4;--mut:#8fb0ba;--main:#3cc0d8;--ok:#4cc27d;--warn:#f08c52;--line:#26434d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:18px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:20px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--main);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--main);border:1px solid var(--main)}
button.del{background:transparent;color:var(--warn);padding:8px 10px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dose{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.dose:first-of-type{border-top:0}
.dose .lbl{flex:1 1 100%;color:var(--mut);font-size:16px}
.dose input[type=time]{font-size:22px;width:130px}
.dose.off input{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);color:var(--mut);font-size:16px;margin-bottom:12px}
.status b{color:var(--ok)}
#alarm{position:fixed;inset:0;background:var(--warn);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;gap:14px}
#alarm.on{display:flex;animation:pulse 1s infinite}
#alarm h2{font-size:34px;margin:0}
#alarm p{font-size:24px;margin:0}
#alarm button{font-size:24px;width:100%;max-width:360px;padding:18px;background:#fff;color:#7a2d00}
#alarm button.s{background:transparent;color:#fff;border:2px solid #fff}
@keyframes pulse{50%{filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){#alarm.on{animation:none}}
.next{font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>منبّه الدواء</h1>
  <p class="sub">حدّد مواعيدك بنفسك، وهيرنّ التنبيه حتى لو التطبيق مقفول.</p>

  <div class="card">
    <div id="status" class="status">اضغط "تفعيل التنبيهات" وسمح بكل الصلاحيات.</div>
    <div class="row">
      <button id="enable">تفعيل التنبيهات</button>
      <button id="test" class="ghost">تجربة تنبيه بعد 10 ثوانٍ</button>
    </div>
  </div>

  <div class="card next" id="nextBox">لا توجد مواعيد قادمة.</div>

  <div id="list"></div>

  <div class="card">
    <h2>إضافة دواء جديد</h2>
    <div class="row">
      <input id="newName" placeholder="اسم الدواء" style="flex:1">
      <button id="addMed">إضافة</button>
    </div>
  </div>
</div>

<script>
const LABELS=["قبل الفطار","بعد الفطار","قبل الغداء","بعد الغداء","قبل العشاء","بعد العشاء","كل 12 ساعة","موعد آخر"];
const KEY="dawa_v1";
const d=(l,t,date)=>({id:Math.random().toString(36).slice(2),label:l,time:t,date:date||"",on:true,last:"",snooze:0});
function defaults(){return[
 {id:"m1",name:"برشام مجهول",doses:[d("قبل الفطار","07:30"),d("قبل الغداء","13:00"),d("قبل العشاء","19:30")]},
 {id:"m2",name:"دواء مجهول",doses:[d("كل 12 ساعة","08:00"),d("كل 12 ساعة","20:00")]},
 {id:"m3",name:"دواء شرب للمعدة",doses:[d("قبل الفطار","07:30"),d("قبل الغداء","13:00"),d("قبل العشاء","19:30")]},
 {id:"m4",name:"الحديد",doses:[d("بعد الغداء","15:00")]},
 {id:"m5",name:"الديدان",doses:[]}
];}
let meds;
try{meds=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(meds))meds=defaults();
function save(){try{localStorage.setItem(KEY,JSON.stringify(meds))}catch(e){}}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())};
const nowHM=()=>{const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())};

function render(){
  const box=$("list");box.innerHTML="";
  meds.forEach(m=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${esc(m.name)}</h2><button class="del" data-delmed="${m.id}">حذف الدواء</button></div>`;
    m.doses.forEach(o=>{
      const r=document.createElement("div");r.className="dose"+(o.on?"":" off");
      r.innerHTML=`<div class="lbl">${esc(o.label)}</div>
        <input type="time" value="${o.time}" data-t="${o.id}">
        <input type="date" value="${o.date}" data-d="${o.id}" title="تاريخ محدد (اختياري)">
        <label class="row"><input type="checkbox" ${o.on?"checked":""} data-on="${o.id}"> مفعّل</label>
        <button class="del" data-deldose="${o.id}">حذف</button>`;
      c.appendChild(r);
    });
    const add=document.createElement("div");add.className="row";add.style.marginTop="10px";
    add.innerHTML=`<select data-sel="${m.id}">${LABELS.map(l=>`<option>${l}</option>`).join("")}</select>
      <button class="ghost" data-adddose="${m.id}">إضافة ميعاد</button>`;
    c.appendChild(add);
    if(!m.doses.length){const p=document.createElement("p");p.className="sub";p.textContent="لا توجد مواعيد. أضف ميعادًا، ويمكنك تحديد تاريخ لو الجرعة مرة واحدة فقط.";c.insertBefore(p,add)}
    box.appendChild(c);
  });
  updateNext();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const findDose=id=>{for(const m of meds){const o=m.doses.find(x=>x.id===id);if(o)return[m,o]}return[]};

document.addEventListener("change",e=>{
  const t=e.target;let id;
  if(id=t.dataset.t){const[,o]=findDose(id);o.time=t.value;o.last="";o.snooze=0}
  else if(id=t.dataset.d){const[,o]=findDose(id);o.date=t.value;o.last=""}
  else if(id=t.dataset.on){const[,o]=findDose(id);o.on=t.checked;render()}
  else return;
  save();updateNext();
});
document.addEventListener("click",e=>{
  const t=e.target;let id;
  if(id=t.dataset.delmed){if(confirm("حذف هذا الدواء؟")){meds=meds.filter(m=>m.id!==id);save();render()}}
  else if(id=t.dataset.deldose){meds.forEach(m=>m.doses=m.doses.filter(o=>o.id!==id));save();render()}
  else if(id=t.dataset.adddose){const m=meds.find(x=>x.id===id);const sel=document.querySelector(`[data-sel="${id}"]`);m.doses.push(d(sel.value,"08:00"));save();render()}
});
$("addMed").onclick=()=>{const v=$("newName").value.trim();if(!v)return;meds.push({id:"m"+Date.now(),name:v,doses:[]});$("newName").value="";save();render()};


const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const setStatus=t=>{$("status").innerHTML=t};
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1}
function save(){try{localStorage.setItem(KEY,JSON.stringify(meds))}catch(e){}schedule()}
async function schedule(){
  if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p.notifications.length)await LN.cancel({notifications:p.notifications});
    const list=[];
    meds.forEach(m=>m.doses.forEach(o=>{
      if(!o.on||!o.time)return;
      const[h,mi]=o.time.split(":").map(Number);
      const n={id:hash(o.id),title:"حان موعد الدواء",body:m.name+" — "+o.label,channelId:"dawa",schedule:{allowWhileIdle:true}};
      if(o.date){const[y,mo,da]=o.date.split("-").map(Number);const t=new Date(y,mo-1,da,h,mi);if(t<=new Date())return;n.schedule.at=t}
      else n.schedule.on={hour:h,minute:mi};
      list.push(n);
    }));
    if(list.length)await LN.schedule({notifications:list});
    setStatus("<b>جاهز.</b> عدد التنبيهات المجدولة: "+list.length);
  }catch(e){setStatus("حدث خطأ: "+esc(e.message||e))}
}
async function enable(){
  if(!LN){setStatus("افتح هذه الصفحة من داخل التطبيق (APK) وليس من المتصفح.");return}
  try{
    await LN.createChannel({id:"dawa",name:"مواعيد الدواء",importance:5,visibility:1,vibration:true});
    const r=await LN.requestPermissions();
    if(r.display!=="granted"){setStatus("لم يتم السماح بالإشعارات. فعّلها من إعدادات الهاتف > التطبيقات.");return}
    try{const x=await LN.checkExactNotificationSetting();if(x.exact_alarm!=="granted")await LN.changeExactNotificationSetting()}catch(e){}
    await schedule();
  }catch(e){setStatus("حدث خطأ: "+esc(e.message||e))}
}
$("enable").onclick=enable;
$("test").onclick=async()=>{
  if(!LN){setStatus("افتح التطبيق على الهاتف لتجربة التنبيه.");return}
  await enable();
  await LN.schedule({notifications:[{id:999999999,title:"تجربة التنبيه",body:"التنبيه يعمل بنجاح",channelId:"dawa",schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
  setStatus("سيصلك تنبيه بعد 10 ثوانٍ. اقفل التطبيق وانتظر.");
};
function updateNext(){
  const n=new Date();let best=null;
  meds.forEach(m=>m.doses.forEach(o=>{
    if(!o.on||!o.time)return;
    const[h,mi]=o.time.split(":").map(Number);let t=new Date(n);
    if(o.date){const[y,mo,da]=o.date.split("-").map(Number);t=new Date(y,mo-1,da,h,mi)}
    else{t.setHours(h,mi,0,0);if(t<=n)t.setDate(t.getDate()+1)}
    if(t<=n)return;if(!best||t<best.t)best={t,m,o};
  }));
  $("nextBox").innerHTML=best?`الموعد القادم: <b>${esc(best.m.name)}</b> — ${esc(best.o.label)} — الساعة ${best.o.time}`:"لا توجد مواعيد قادمة.";
}
setInterval(updateNext,30000);
render();
if(LN){LN.createChannel({id:"dawa",name:"مواعيد الدواء",importance:5,visibility:1,vibration:true}).then(schedule).catch(()=>{})}
</script>
</body>
</html>
