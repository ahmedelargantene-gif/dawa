name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          python3 -c "
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          names=['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE','WAKE_LOCK']
          add=''.join('<uses-permission android:name=\"android.permission.%s\"/>'%n for n in names)
          open(p,'w').write(s.replace('</manifest>',add+'</manifest>'))
          "
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dawa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
